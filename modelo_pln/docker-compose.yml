services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: almabot
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"

  db_init:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: almabot
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./src/database/schema.sql:/schema.sql
      - ./init_db.sh:/init_db.sh
    depends_on:
      - db
    command: sh -c "mysql -h db -u${DB_USER} -p${DB_PASSWORD} almabot < /schema.sql"
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
    ports:
      - "8000:8000"
    depends_on:
      - db_init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      - db_init

  training:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
    volumes:
      - ./data/models:/app/data/models
      - ./data/raw/training_phrases.csv:/app/data/raw/training_phrases.csv
      - ./data/raw/Bullying_2018_copy_traducido_final.csv:/app/data/raw/Bullying_2018_copy_traducido_final.csv
    depends_on:
      - db

volumes:
  mysql_data: 
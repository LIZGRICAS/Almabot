version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: almabot
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
    ports:
      - "8000:8000"
    depends_on:
      - db

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      - db

  training:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=almabot
    volumes:
      - ./data/models:/app/data/models
      - ./data/raw/training_phrases.csv:/app/data/raw/training_phrases.csv
      - ./data/raw/Bullying_2018_copy_traducido_final.csv:/app/data/raw/Bullying_2018_copy_traducido_final.csv
    depends_on:
      - db

volumes:
  mysql_data: 